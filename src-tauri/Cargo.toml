[package]
name = "vxml-editor"
version = "0.1.0"
description = "VoiceXML 2.1 Editor Desktop Application"
authors = ["VoiceXML Studio Contributors"]
license = "AGPL-3.0-or-later"
edition = "2021"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2", features = [] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"

